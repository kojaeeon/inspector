name: Windows build and smoke test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      RUSTFLAGS: "-C target-feature=+crt-static"
    steps:
      - uses: actions/checkout@v4
      - name: Run tests and build Windows x64
        shell: pwsh
        run: |
          cargo test --locked --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked --release --target x86_64-pc-windows-msvc
      - name: Observe synthetic dialogs
        shell: pwsh
        run: ./tests/windows-smoke.ps1 -Inspector ./target/x86_64-pc-windows-msvc/release/inspector.exe
      - uses: actions/upload-artifact@v4
        with:
          name: inspector-windows-x64
          path: target/x86_64-pc-windows-msvc/release/inspector.exe
          if-no-files-found: error

      - name: Package portable and publish verified build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/inspector.exe portable/
          Copy-Item README.md portable/
          Set-Content -Encoding utf8 portable/SOURCE.txt "Source: https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
          Compress-Archive -Path portable/* -DestinationPath inspector-windows-x64-portable.zip
          $hash = (Get-FileHash inspector-windows-x64-portable.zip -Algorithm SHA256).Hash.ToLower()
          Set-Content -Encoding ascii SHA256SUMS.txt "$hash  inspector-windows-x64-portable.zip"
          gh release create "dll-${{ github.sha }}" inspector-windows-x64-portable.zip SHA256SUMS.txt --target "${{ github.sha }}" --title "Inspector DLL tracing portable" --notes "Windows tests and synthetic dialog/DLL load-unload smoke test passed. Source commit: ${{ github.sha }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
